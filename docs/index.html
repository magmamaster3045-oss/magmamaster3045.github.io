<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Tugearth</title>

<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Container */
.map-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* SVG scales perfectly */
svg {
  max-width: 100%;
  max-height: 100%;
}

/* 🔥 TOGGLE */
:root {
  --debug: 0; /* change to 1 to see regions */
}

/* Clickable regions */
.region {
  fill: rgba(255, 0, 0, calc(var(--debug) * 0.3));
  stroke: rgba(255, 0, 0, var(--debug));
  stroke-width: 2;
  cursor: pointer;
}

.region:hover {
  fill: rgba(255, 255, 255, 0.2);
}
</style>
</head>
<body>

<div class="map-container">

<svg viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet">

  <image href="fullmap.jpg" x="0" y="0" width="1536" height="1024"/>
